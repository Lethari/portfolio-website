<main>
    <section class="form-section">
    <h2>Get In Touch</h2>
    <p>Feel free to reach out to me with any questions or inquiries. I look forward to hearing from you!</p>

    <form action="#" method="post" class="contact-form">
    <fieldset>
    <legend>Contact details</legend> <!-- Form for user to input contact details -->
    <p class="form-group">
    <label for="name">Name</label>
    <input
    type="text"
    id="name"
    name="name"
    placeholder="Name"
    autocomplete="name"
    minlength="2"
    required
    >
    </p>

    <p class="form-group">
    <label for="surname">Surname</label>
    <input
    type="text"
    id="surname"
    name="surname"
    placeholder="Surname"
    autocomplete="family-name"
    minlength="2"
    required
    >
    </p>

    <p class="form-group">
    <label for="contact-number">Contact Number</label>
    <input
    type="tel"
    id="contact-number"
    name="contact-number"
    placeholder="Contact Number"
    autocomplete="tel"
    pattern="[0-9]{10}"
    required
    >
    </p>

    <p class="form-group">
    <label for="email">Email</label>
    <input
    type="email"
    id="email"
    name="email"
    placeholder="Email"
    autocomplete="email"
    required
    >
    </p>

    <p class="form-group">
    <label for="portfolio">Portfolio URL</label>
    <input type="url" id="portfolio" name="portfolio" placeholder="https://example.com" autocomplete="url">
    </p>

    <p class="form-group">
    <label for="preferred-date">Preferred contact date</label>
    <input type="date" id="preferred-date" name="preferred-date">
    </p>

    <p class="form-group">
    <label for="message">Message</label>
    <textarea
    id="message"
    name="message"
    placeholder="Message"
    autocomplete="off"
    minlength="10"
    required
    rows="8"
    >
    </textarea>
    </p>
    </fieldset>

    <button type="submit">Send Message</button>
    <p id="success-message" class="success-message" hidden>Message sent successfully!</p>
    </form>
    </section>
</main>
